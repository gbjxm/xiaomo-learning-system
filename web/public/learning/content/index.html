<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的内容 · 小陌的个人终端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e1e9d7'/%3E%3Cpath d='M9 8h14v17H9zM12 13h8M12 17h6' fill='none' stroke='%23365c53' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/terminal/shell.css">
  <link rel="stylesheet" href="/learning/学习工坊.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/workspace/relations.css">
  <script src="/terminal/shell.js" defer></script>
  <script src="/learning/学习工坊.js" defer></script>
  <script src="app.js" defer></script>
  <script src="/workspace/relations.js" defer></script>
</head>
<body data-terminal-module="learning" data-terminal-section="learning">
  <main class="content-shell">
    <header class="page-heading">
      <div><a id="backToIsland" class="back-link" href="/terminal/#home">← 回到主岛</a><h1>我的内容</h1><p>一个想法、一段课程笔记，或一部看过的作品。都可以从这里接着走。</p></div>
      <div class="heading-actions"><a id="talkToGuide" href="/learning/?entry=record">和学习向导聊</a><button id="newContent" class="primary" disabled>留下一点</button></div>
    </header>
    <div class="connection-line"><span id="connectionState">正在找回内容…</span><button id="reloadContent" class="text-button">重新加载</button><span id="islandContext"></span></div>
    <p id="pageNotice" class="notice" role="status" hidden></p>
    <details id="sourceWarnings" class="source-warnings" hidden><summary>有部分内容暂时没有读到</summary><div></div></details>
    <div class="content-layout">
      <section class="collection-panel" aria-label="已留下的内容">
        <div class="collection-toolbar">
          <div class="kind-tabs" role="group" aria-label="内容种类">
            <button data-kind="all" aria-pressed="true">全部</button>
            <button data-kind="creation" aria-pressed="false">创作与想法</button>
            <button data-kind="watch" aria-pressed="false">观看记录</button>
            <button data-kind="learning" aria-pressed="false">学习笔记</button>
          </div>
          <details id="searchDetails" class="search-disclosure"><summary>查找</summary><form id="searchForm"><label for="searchInput" class="sr-only">查找内容</label><input id="searchInput" type="search" placeholder="作品名、关键词…" maxlength="200"><button type="submit">查找</button><button type="button" id="clearSearch" class="text-button">清除</button></form></details>
        </div>
        <div class="collection-caption"><span id="contentCount">正在读取</span><span>最近更新在前</span></div>
        <div id="contentList" class="content-list" tabindex="0" aria-label="我的内容列表"></div>
      </section>
      <section id="detailPanel" class="detail-panel" aria-label="内容详情"><div class="empty-detail"><span class="small-label">慢慢积累</span><h2>留下的内容，都在这里。</h2><p>点开一份内容继续，也可以随手留下一句话。</p></div></section>
    </div>
  </main>
</body>
</html>
